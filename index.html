
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Celestial Hub | Key System</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #171717;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 34px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border: 1px solid #505050;
      border-radius: 17px;
      display: grid;
      place-items: center;
      margin: 0 auto 17px;
      font-size: 27px;
      background: #242424;
    }

    h1 {
      font-size: 24px;
      letter-spacing: 2px;
      margin: 0 0 9px;
    }

    .subtitle {
      color: #999;
      font-size: 13px;
      letter-spacing: 1.5px;
    }

    .panel {
      border: 1px solid #393939;
      background: #202020;
      border-radius: 16px;
      padding: 24px;
    }

    h2 {
      font-size: 19px;
      margin: 0 0 10px;
    }

    .description {
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 23px;
    }

    .info {
      background: #292929;
      border: 1px solid #3b3b3b;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      margin: 7px 0;
    }

    .muted { color: #aaa; }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 15px;
      background: #f1f1f1;
      color: #171717;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:active { transform: scale(.98); }

    .notice {
      color: #999;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
      margin-top: 18px;
    }

    footer {
      color: #666;
      text-align: center;
      font-size: 11px;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="brand">
      <div class="logo">✦</div>
      <h1>CELESTIAL HUB</h1>
      <div class="subtitle">KEY SYSTEM</div>
    </header>

    <section class="panel">
      <h2>Welcome to CH.</h2>
      <p class="description">
        Manage your access to Celestial Hub
        through our key authorization system.
      </p>

      <div class="info">
        <div class="info-row">
          <span class="muted">System status</span>
          <span>Interface preview</span>
        </div>
        <div class="info-row">
          <span class="muted">Key duration</span>
          <strong>7 days</strong>
        </div>
        <div class="info-row">
          <span class="muted">Access type</span>
          <strong>Individual</strong>
        </div>
      </div>

      <button id="getKey">GET YOUR KEY</button>

      <p class="notice" id="message">
        The key service is not connected yet.
      </p>
    </section>

    <footer>
      CELESTIAL HUB · 2026
    </footer>
  </main>

  <script>
    document.getElementById("getKey").addEventListener("click", () => {
      document.getElementById("message").textContent =
        "The key service is not configured yet. Please check back later.";
    });
  </script>
</body>
</html>
