
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="Celestial Hub key authorization system.">
  <title>Celestial Hub | Key System</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #171717;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .container { width: 100%; max-width: 430px; }

    .brand { text-align: center; margin-bottom: 34px; }

    .logo {
      width: 58px;
      height: 58px;
      border: 1px solid #505050;
      border-radius: 17px;
      display: grid;
      place-items: center;
      margin: 0 auto 17px;
      font-size: 27px;
      background: #242424;
    }

    h1 { font-size: 24px; letter-spacing: 2px; margin: 0 0 9px; }
    .subtitle { color: #999; font-size: 13px; letter-spacing: 1.5px; }

    .panel {
      border: 1px solid #393939;
      background: #202020;
      border-radius: 16px;
      padding: 24px;
    }

    h2 { font-size: 19px; margin: 0 0 10px; }

    .description {
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 23px;
    }

    .info {
      background: #292929;
      border: 1px solid #3b3b3b;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      margin: 7px 0;
    }

    .muted { color: #aaa; }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 15px;
      background: #f1f1f1;
      color: #171717;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity .15s ease, transform .15s ease;
    }

    button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .secondary-button {
      margin-top: 10px;
      background: transparent;
      border: 1px solid #505050;
      color: #ddd;
    }

    .notice {
      color: #999;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    .key-output {
      display: block;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #454545;
      border-radius: 8px;
      background: #171717;
      color: #f5f5f5;
      overflow-wrap: anywhere;
      user-select: text;
    }

    footer {
      color: #666;
      text-align: center;
      font-size: 11px;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="brand">
      <div class="logo" aria-hidden="true">✦</div>
      <h1>CELESTIAL HUB</h1>
      <div class="subtitle">KEY SYSTEM</div>
    </header>

    <section class="panel" aria-labelledby="panelTitle">

      <h2 id="panelTitle">Welcome to CH.</h2>

      <p class="description">
        Manage your access to Celestial Hub
        through our key authorization system.
      </p>

      <div class="info">
        <div class="info-row">
          <span class="muted">System status</span>
          <strong id="systemStatus">Checking...</strong>
        </div>

        <div class="info-row">
          <span class="muted">Key duration</span>
          <strong>7 days</strong>
        </div>

        <div class="info-row">
          <span class="muted">Access type</span>
          <strong>Individual</strong>
        </div>
      </div>

      <button id="getKey" type="button">
        CONTINUE WITH DISCORD
      </button>

      <button
        id="signOut"
        class="secondary-button"
        type="button"
        hidden
      >
        DISCONNECT
      </button>

      <p class="notice" id="message" role="status" aria-live="polite">
        Connect your Discord account to continue.
      </p>

    </section>

    <footer>CELESTIAL HUB · 2026</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
      "https://akxyyptodcswvrghuzbi.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_-z3JDrLnbW_dKb44qAu8JQ_nZb85XVs";

    // Correct GitHub Pages URL
    const REDIRECT_URL =
      "https://cloudysday2011-crypto.github.io/CH-key-System/";

    // Edge Function name
    const KEY_FUNCTION = "smooth-function";

    // ==========================================
    // DOM ELEMENTS
    // ==========================================

    const button = document.getElementById("getKey");
    const signOutButton = document.getElementById("signOut");
    const message = document.getElementById("message");
    const systemStatus = document.getElementById("systemStatus");

    let supabaseClient = null;
    let currentSession = null;
    let busy = false;

    // ==========================================
    // UI HELPERS
    // ==========================================

    function setMessage(text) {
      message.textContent = text;
    }

    function showKey(key) {
      message.replaceChildren(
        document.createTextNode(
          "Your 7-day key. Save it somewhere safe:"
        )
      );

      const output = document.createElement("code");
      output.className = "key-output";
      output.textContent = key;

      message.appendChild(output);

      const copyButton = document.createElement("button");
      copyButton.className = "secondary-button";
      copyButton.textContent = "COPY KEY";

      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(key);
          copyButton.textContent = "COPIED!";
        } catch (error) {
          setMessage(
            "Copy failed. Select and copy your key manually."
          );
        }
      });

      message.appendChild(copyButton);
    }

    function renderSession(session) {
      currentSession = session;

      const signedIn = Boolean(session && session.user);

      button.textContent = signedIn
        ? "GET YOUR KEY"
        : "CONTINUE WITH DISCORD";

      signOutButton.hidden = !signedIn;

      systemStatus.textContent = signedIn
        ? "Discord connected"
        : "Ready for sign-in";

      if (signedIn) {
        const metadata = session.user.user_metadata || {};

        const name =
          metadata.full_name ||
          metadata.name ||
          metadata.user_name ||
          "Discord user";

        setMessage(
          "Signed in as " + name +
          ". You can now request your Celestial Hub key."
        );
      } else {
        setMessage("Connect your Discord account to continue.");
      }
    }

    // ==========================================
    // INITIALIZE SUPABASE
    // ==========================================

    if (
      !window.supabase ||
      !SUPABASE_PUBLISHABLE_KEY
    ) {

      systemStatus.textContent = "Setup required";
      button.disabled = true;

      setMessage("Supabase configuration is missing.");

    } else {

      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

      // ==========================================
      // DISCORD LOGIN / KEY GENERATION
      // ==========================================

      button.addEventListener("click", async () => {

        if (busy) return;

        busy = true;
        button.disabled = true;

        const originalText = button.textContent;

        try {

          // STEP 1: DISCORD LOGIN

          if (!currentSession) {

            button.textContent = "CONNECTING...";

            const { error } =
              await supabaseClient.auth.signInWithOAuth({
                provider: "discord",

                options: {
                  redirectTo: REDIRECT_URL
                }
              });

            if (error) throw error;

            return;
          }

          // STEP 2: VERIFY AUTHENTICATION

          button.textContent = "VERIFYING SESSION...";

          const {
            data: sessionData,
            error: sessionError
          } = await supabaseClient.auth.getSession();

          if (sessionError) throw sessionError;

          const session = sessionData.session;

          if (!session || !session.access_token) {

            currentSession = null;
            renderSession(null);

            throw new Error(
              "Authentication session expired. Please reconnect."
            );
          }

          currentSession = session;

          // STEP 3: CALL EDGE FUNCTION

          button.textContent = "GENERATING YOUR KEY...";

          const { data, error } =
            await supabaseClient.functions.invoke(
              KEY_FUNCTION,
              {
                body: {}
              }
            );

          // STEP 4: HANDLE ERRORS

          if (error) {

            console.error("Key service error:", error);

            let serverError = null;

            try {
              if (
                error.context &&
                typeof error.context.clone === "function"
              ) {
                serverError = await error.context.clone().json();
              }
            } catch (_) {
              // Response could not be parsed.
            }

            if (
              serverError?.error ===
              "An active key already exists."
            ) {

              setMessage(
                "You already have an active key. Expires at: " +
                (serverError.expires_at || "Check your account.")
              );

              return;
            }

            if (error.context?.status === 401) {

              setMessage(
                "Authentication failed. Please reconnect your Discord account."
              );

              return;
            }

            if (error.context?.status === 409) {

              setMessage(
                serverError?.error ||
                "An active key already exists."
              );

              return;
            }

            setMessage(
              serverError?.error ||
              "The key service returned an error. Check Supabase Edge Function logs."
            );

            return;
          }

          // STEP 5: DISPLAY KEY

          if (
            data &&
            typeof data.key === "string" &&
            data.key.length > 0
          ) {

            showKey(data.key);
            systemStatus.textContent = "Key generated";

          } else {

            console.error(
              "Unexpected key service response:",
              data
            );

            setMessage(
              "The key service responded, but did not return a valid key."
            );
          }

        } catch (error) {

          console.error("Celestial Hub error:", error);

          setMessage(
            error.message ||
            "Something went wrong. Check your Supabase configuration."
          );

        } finally {

          busy = false;
          button.disabled = false;

          if (
            button.textContent === "CONNECTING..." ||
            button.textContent === "VERIFYING SESSION..." ||
            button.textContent === "GENERATING YOUR KEY..."
          ) {
            button.textContent = originalText;
          }
        }
      });

      // ==========================================
      // DISCONNECT ACCOUNT
      // ==========================================

      signOutButton.addEventListener("click", async () => {

        if (busy) return;

        signOutButton.disabled = true;

        try {

          const { error } =
            await supabaseClient.auth.signOut();

          if (error) throw error;

          renderSession(null);
          systemStatus.textContent = "Disconnected";

        } catch (error) {

          console.error("Sign-out error:", error);

          setMessage(
            "Could not disconnect right now. Please try again."
          );

        } finally {

          signOutButton.disabled = false;

        }
      });

      // ==========================================
      // RESTORE SESSION
      // ==========================================

      supabaseClient.auth.getSession().then(
        ({ data, error }) => {

          if (error) {

            console.error("Session check error:", error);

            systemStatus.textContent = "Connection issue";

            setMessage(
              "Could not check your session. Refresh the page and try again."
            );

            return;
          }

          renderSession(data.session);
        }
      );

      // ==========================================
      // AUTH STATE LISTENER
      // ==========================================

      supabaseClient.auth.onAuthStateChange(
        (_event, session) => {
          renderSession(session);
        }
      );
    }
  </script>
</body>
</html>
